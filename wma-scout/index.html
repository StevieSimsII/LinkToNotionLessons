<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14170f">
  <title>WMA Scout · Ten Point</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="toggleSidebar" title="Show/hide panel" aria-label="Toggle panel">☰</button>
    <div class="brand">
      <strong>WMA Scout</strong>
      <span class="sub" id="brandSub">Phil Bryant WMA · Ten Point · Dec 17–20, 2026</span>
    </div>
    <div class="chip" id="countdown" title="Countdown"></div>
    <label class="wind-pick" title="Wind direction (where it's blowing FROM). Draws scent cones from every stand.">
      <span>Wind</span>
      <select id="windSelect"></select>
    </label>
    <button class="btn accent" id="fieldModeBtn" title="Big-button quick logging at your GPS position">📍 Field Log</button>
  </header>

  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav class="tabs" role="tablist">
        <button data-tab="layers" class="active">🗺️<span>Layers</span></button>
        <button data-tab="mark">✏️<span>Mark</span></button>
        <button data-tab="intel">🧠<span>Deer Intel</span></button>
        <button data-tab="plan">📅<span>Plan</span></button>
        <button data-tab="log">📓<span>Log</span></button>
        <button data-tab="data">💾<span>Data</span></button>
      </nav>
      <section class="panel active" id="panel-layers"></section>
      <section class="panel" id="panel-mark"></section>
      <section class="panel" id="panel-intel"></section>
      <section class="panel" id="panel-plan"></section>
      <section class="panel" id="panel-log"></section>
      <section class="panel" id="panel-data"></section>
    </aside>

    <main class="map-wrap">
      <div id="map"></div>
      <div class="drawbar hidden" id="drawbar">
        <span id="drawMsg">Drawing…</span>
        <button class="btn small" id="drawUndo">Undo point</button>
        <button class="btn small accent" id="drawFinish">Finish</button>
        <button class="btn small ghost" id="drawCancel">Cancel</button>
      </div>
      <div class="readout" id="readout">Tap the map for elevation</div>
      <div class="legend hidden" id="legend"></div>
    </main>
  </div>

  <div class="modal hidden" id="fieldModal">
    <div class="modal-card">
      <div class="modal-head">
        <strong>Field Log</strong>
        <span id="gpsStatus" class="muted">Locating…</span>
        <button class="icon-btn" id="fieldClose" aria-label="Close">✕</button>
      </div>
      <div class="field-grid" id="fieldGrid"></div>
      <textarea id="fieldNote" placeholder="Optional note (size of rub, track direction, wind, time)…"></textarea>
      <label class="btn ghost small file-btn">📷 Attach photo<input type="file" id="fieldPhoto" accept="image/*" capture="environment" hidden></label>
      <p class="muted small">Logs at your phone's GPS fix. Without signal, GPS still works; the map tiles only show if you cached the area beforehand (Data tab).</p>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/togeojson.umd.js"></script>
  <script src="vendor/jszip.min.js"></script>
  <script src="js/core.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/analysis.js"></script>
  <script src="js/io.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
